<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindStorm Comics - Vent & Create</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a24;
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto; 
        }

        h1 {
            font-size: 1.5rem;
            margin: 10px 0 5px 0;
            color: #00d2ff;
            text-shadow: 0 0 10px rgba(0,210,255,0.3);
            font-weight: 800;
            letter-spacing: 1px;
        }

        .dashboard {
            background: #242432;
            width: 100%;
            max-width: 360px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 2px solid #00d2ff;
        }

        .streak-zone {
            font-size: 1.4rem;
            font-weight: bold;
            color: #ff5722;
            text-align: center;
            margin-bottom: 12px;
            text-shadow: 0 0 8px rgba(255,87,34,0.3);
        }

        .challenge-box {
            background: #1d3557;
            border-left: 5px solid #00d2ff;
            padding: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            margin-bottom: 15px;
            border-radius: 0 8px 8px 0;
            color: #e0f7fa;
            line-height: 1.4;
        }

        .rating-title {
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: #a0a0b0;
        }

        .rating-zone {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .thumb-btn {
            font-size: 1.6rem;
            background: #1a1a24;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .thumb-btn.selected {
            background-color: #00d2ff;
            border-color: #fff;
            transform: scale(1.15);
        }

        #saveDayBtn {
            width: 100%;
            padding: 10px;
            background: #2ecc71;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(46,204,113,0.3);
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 360px;
        }
        .controls button {
            flex: 1;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-pen { background-color: #00d2ff; color: #1a1a24; }
        .btn-eraser { background-color: #444; color: #fff; }
        .btn-clear { background-color: #e74c3c; color: #fff; }
        .controls button.active { background-color: #fff; color: #000; box-shadow: 0 0 12px rgba(255,255,255,0.5); }

        .comic-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 360px;
        }
        .canvas-box {
            background-color: #fff;
            border: 4px solid #00d2ff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            touch-action: none; 
        }

        .share-zone {
            width: 100%;
            max-width: 360px;
            margin-top: 20px;
            margin-bottom: 40px;
        }
        .btn-share {
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            background: linear-gradient(45deg, #00d2ff, #0076ff);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,210,255,0.4);
        }
    </style>
</head>
<body>

    <h1>MindStorm Comics</h1>

    <div class="dashboard">
        <div class="streak-zone" id="streakDisplay">⚡ Putki: 0 päivää</div>
        
        <div class="rating-title">Päivän haaste (Kanavoi myrsky taiteeksi):</div>
        <div class="challenge-box" id="challengeDisplay">Ladataan haastetta...</div>

        <div class="rating-title">Miten sait purettua tunteet? (1-5 salamaa):</div>
        <div class="rating-zone">
            <button class="thumb-btn" data-value="1">⚡</button>
            <button class="thumb-btn" data-value="2">⚡</button>
            <button class="thumb-btn" data-value="3">⚡</button>
            <button class="thumb-btn" data-value="4">⚡</button>
            <button class="thumb-btn" data-value="5">⚡</button>
        </div>
        <button id="saveDayBtn">Lukitse päivä & kasvata voimaa!</button>
    </div>

    <div class="controls">
        <button id="penBtn" class="btn-pen active">Kynä</button>
        <button id="eraserBtn" class="btn-eraser">Kumi</button>
        <button id="clearBtn" class="btn-clear">Tyhjennä</button>
    </div>

    <div class="comic-container">
        <div class="canvas-box"><canvas id="canvas1"></canvas></div>
        <div class="canvas-box"><canvas id="canvas2"></canvas></div>
        <div class="canvas-box"><canvas id="canvas3"></canvas></div>
    </div>

    <div class="share-zone">
        <button id="shareBtn" class="btn-share">📤 Jaa MindStorm-sarjakuvasi</button>
    </div>

    <script>
        const haasteet = [
            "Piirrä 10 vapaan käden ympyrää niin nopeasti kuin pystyt ennen sarjakuvaa!",
            "Joku kiroili livessä! Piirrä robotti, joka syö kirosanoja ja muuttaa ne puhtaaksi energiaksi.",
            "Tunteet nousivat! Piirrä miltä viha tai turhautuminen näyttää futuristisena laitteena ruudussa 1.",
            "Liven chatti käy kuumana. Piirrä tulevaisuuden 'rauhan-säde', joka rauhoittaa katsojat.",
            "Harjoittele perusmuotoja: Tee ruutu 1 pelkillä kuutioilla ja ruutu 2 pelkillä lieriöillä."
        ];

        const dayOfYear = Math.floor(new Date() / 8.64e7);
        document.getElementById('challengeDisplay').innerText = haasteet[dayOfYear % haasteet.length];

        let streak = parseInt(localStorage.getItem('ms_streak')) || 0;
        let lastSavedDate = localStorage.getItem('ms_last_date') || "";
        let currentRating = 0;

        const streakDisplay = document.getElementById('streakDisplay');
        streakDisplay.innerText = `⚡ Putki: ${streak} päivää`;

        const thumbBtns = document.querySelectorAll('.thumb-btn');
        thumbBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                currentRating = parseInt(btn.getAttribute('data-value'));
                thumbBtns.forEach((b, idx) => {
                    if (idx < currentRating) b.classList.add('selected');
                    else b.classList.remove('selected');
                });
            });
        });

        document.getElementById('saveDayBtn').addEventListener('click', () => {
            const todayStr = new Date().toDateString();
            if (currentRating === 0) { alert("Anna itsellesi arvosana ennen tallennusta!"); return; }
            if (lastSavedDate === todayStr) { alert("Tämä päivä on jo suoritettu!"); return; }

            streak++;
            localStorage.setItem('ms_streak', streak);
            localStorage.setItem('ms_last_date', todayStr);
            
            streakDisplay.innerText = `⚡ Putki: ${streak} päivää`;
            alert(`Upeaa! Päivä tallennettu. Putkesi on nyt ${streak} päivää!`);
        });

        const canvases = [
            document.getElementById('canvas1'),
            document.getElementById('canvas2'),
            document.getElementById('canvas3')
        ];

        let isDrawing = false;
        let mode = 'pen';

        const penBtn = document.getElementById('penBtn');
        const eraserBtn = document.getElementById('eraserBtn');
        const clearBtn = document.getElementById('clearBtn');

        // Korjattu nappien aktiivisuus-tyylittely
        penBtn.addEventListener('click', () => { mode = 'pen'; penBtn.classList.add('active'); eraserBtn.classList.remove('active'); });
        eraserBtn.addEventListener('click', () => { mode = 'eraser'; eraserBtn.classList.add('active'); penBtn.classList.remove('active'); });
        
        canvases.forEach(canvas => {
            const ctx = canvas.getContext('2d');
            canvas.width = 400;
            canvas.height = 400;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // TÄYSIN KORJATTU SORMITUNNISTUS ([0] lisätty):
            function getTouchPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.touches[0].clientX - rect.left) * (canvas.width / rect.width),
                    y: (e.touches[0].clientY - rect.top) * (canvas.height / rect.height)
                };
            }

            canvas.addEventListener('touchstart', (e) => {
                isDrawing = true;
                const pos = getTouchPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
            });

            canvas.addEventListener('touchmove', (e) => {
                if (!isDrawing) return;
